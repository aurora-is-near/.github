name: Quality & Security Analysis
on:
  workflow_call:
    inputs:
      force_all_checks:
        required: false
        type: string
        description: "Trigger all checks even if files are unchanged"
      ignore_failures:
        required: false
        type: string
        description: "Don't block CI on failed security checks"

jobs:
  notice:
    runs-on: ubuntu-latest
    name: Deprecation notice
    steps:
      - run: echo "Backstage integration removed. This workflow does nothing and can be removed from caller repos."
